name: Matrix and Cache
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  test_and_reports:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18, 20]
    
    steps:
      - name: GitHub Action Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Check Node version
        run: node --version

      - name: Create report
        run: |
          mkdir -p reports
          echo "Node.js version: $(node --version)" > reports/node-${{ matrix.node-version }}.txt
          echo "Runner OS: $(uname -s)" >> reports/node-${{ matrix.node-version }}.txt
          echo "Repository: ${{ github.repository }}" >> reports/node-${{ matrix.node-version }}.txt
          echo "Commit: ${{ github.sha }}" >> reports/node-${{ matrix.node-version }}.txt
      
      - name: Upload report ( Artifact )
        uses: actions/upload-artifact@v4
        with:
          name: report-node-${{ matrix.node-version }}
          path: reports/

  summarize:
    needs: test_and_reports
    runs-on: ubuntu-latest
    steps:
      - name: Download reports
        uses: actions/download-artifact@v4

      - name: Print reports
        run: |
          find . -type f -name "*.txt" -print
          cat report-node-18/node-18.txt
          cat report-node-20/node-20.txt